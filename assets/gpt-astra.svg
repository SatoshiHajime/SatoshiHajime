<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="astra-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="astra-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- SkillIcon matching container -->
  <rect width="48" height="48" rx="10" fill="url(#astra-bg)" stroke="#10a37f" stroke-width="1" stroke-opacity="0.4"/>
  
  <!-- Outer orbital ring -->
  <circle cx="24" cy="24" r="16" fill="none" stroke="#10a37f" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  
  <!-- GPT Astra Agentic Emblem -->
  <g transform="translate(24, 24)" filter="url(#glow-effect)">
    <!-- 8-point geometric celestial compass / Astra Star -->
    <path d="M0,-15 L2.8,-4.2 L13.6,-13.6 L4.2,-2.8 L15,0 L4.2,2.8 L13.6,13.6 L2.8,4.2 L0,15 L-2.8,4.2 L-13.6,13.6 L-4.2,2.8 L-15,0 L-4.2,-2.8 L-13.6,-13.6 L-2.8,-4.2 Z" 
          fill="url(#astra-grad)"/>

    <!-- OpenAI-inspired inner rosette hexagon -->
    <circle cx="0" cy="0" r="6" fill="#0d1117" stroke="#10a37f" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3.2" fill="url(#core-glow)"/>
  </g>
</svg>
